name: Tag release

# Creates the vX.Y.Z tag and a GitHub Release, with notes generated from the Conventional Commit
# subjects since the previous tag, when the app version on `main` has no release yet.
# It uses only the built-in GITHUB_TOKEN, so it needs no secrets. The signed release bundle is
# built separately by the manual "Release" workflow, which needs the production signing secrets.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Commit to tag (defaults to the workflow commit)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/tag-release.yml'
      - 'scripts/release-notes.sh'

concurrency:
  group: tag-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag_release:
    name: "Create tag and release"
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName = "\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not read a SemVer versionName from app/build.gradle.kts (got '${version}')." >&2
            exit 1
          fi
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Create release when the tag is new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ inputs.target || github.sha }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi

          # The newest earlier version tag that is reachable from the target commit, if any.
          previous="$(git tag --list 'v[0-9]*' --merged "${TARGET}" --sort=-v:refname | grep -vx "${TAG}" | head -n 1 || true)"
          bash scripts/release-notes.sh "${TAG}" "${TARGET}" "${previous}" > release-notes.md
          cat release-notes.md

          gh release create "${TAG}" \
            --target "${TARGET}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            --latest
